<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/proyecto-js-sudoku-solver/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sudoku-solver</title>
    <script type="module" crossorigin src="/proyecto-js-sudoku-solver/assets/index-BLqSthnV.js"></script>
    <link rel="stylesheet" crossorigin href="/proyecto-js-sudoku-solver/assets/index-BUzun8oi.css">
  </head>
  <body>
    <div class="container">
      <h1>Sudoku</h1>
      <p id="instrucciones">Ingresa tu propio sudoku pulsando <strong>Ingresar</strong> o pulsa <strong>Generar</strong> para iniciar uno automáticamente</p>

      <!-- buttons -->
      <div id="controls">
        <button type="button" id="ingresar" class="active">Ingresar Sudoku</button>
        <button type="button" id="generar" class="active">Generar Sudoku</button>
        <button type="button" id="cargar" class="inactive">Cargar formulario -> Tablero</button>
        <button type="button" id="continuar" class="inactive">Continuar Partida</button>
        <button type="button" id="resolver" class="inactive">Resolver</button>
        <button type="button" id="reiniciar" class="inactive">Reiniciar</button>
      </div>
      <div id="entrada-container"></div>

      <div id="container-errors-timmer">
        <!-- Timmer -->
        <p id="timmer" class="inactive">00:00:00</p>

        <!-- Errors -->
        <p id="errors" class="inactive"><strong class="textError">Errores:</strong> <span class="amountError">0</span></p>
      </div>

  <!-- 9x9 board-->    
      <div id="board"></div>
      <div id="digits"></div>
    </div>

  </body>
</html>
