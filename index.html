<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/proyecto-js-sudoku-solver/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sudoku-solver</title>
    <script type="module" crossorigin src="/proyecto-js-sudoku-solver/assets/index-CpT_NO0a.js"></script>
    <link rel="stylesheet" crossorigin href="/proyecto-js-sudoku-solver/assets/index-BQDc_j5D.css">
  </head>
  <body>
    <h1>Sudoku</h1>
    <p id="instrucciones">Ingresa tu propio sudoku pulsando <strong>Ingresar</strong> o pulsa <strong>Generar</strong> para iniciar uno automáticamente</p>

    <!-- buttons -->
    <div id="controls">
      <button type="button" id="ingresar" class="active">Ingresar Sudoku</button>
      <button type="button" id="generar" class="active">Generar Sudoku</button>
      <button type="button" id="cargar" class="inactive">Cargar formulario -> Tablero</button>
      <button type="button" id="resolver" class="inactive">Resolver</button>
    </div>
    <div id="entrada-container"></div>

    <!-- Errors -->
    <h2 id="errors">Errores: <span>0</span></h2>

    <!-- Timmer -->
    <!-- <p id="timmer"></p> -->
<!-- 9x9 board-->    
    <div id="board"></div>
    <div id="digits"></div>
  </body>
</html>
